services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nikenbakery:latest
    container_name: nikenbakery-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/nikenbakery.db
      - UPLOAD_DIR=/app/data/uploads
      - HOSTNAME=0.0.0.0
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

